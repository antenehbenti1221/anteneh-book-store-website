<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anteneh Book Store — Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><div id="login"><p class="eyebrow">🔐 PRIVATE ADMIN</p><h1>Store dashboard</h1><p>Sign in with your email. A secure magic link will be sent to you.</p><input id="email" type="email" placeholder="Your email" style="width:100%;max-width:420px"><br><button class="btn primary" id="send">Send sign-in link</button><div id="loginMsg"></div><hr><p><b>First-time setup:</b> after signing in, enter the one-time admin setup code.</p><input id="setupCode" placeholder="One-time admin setup code" style="width:100%;max-width:420px"><button class="btn" id="claim">Claim admin access</button></div><div id="dash" hidden><div class="heading"><div><p class="eyebrow">🇪🇹 ADMIN</p><h1>Anteneh Book Store</h1></div><button class="btn" id="logout">Sign out</button></div><div class="payment"><h2>Products</h2><form id="bookForm"><input type="hidden" id="bookId"><label>Title<input id="title" required></label><label>Description<textarea id="description"></textarea></label><div class="two"><label>Language<input id="language" value="English"></label><label>Type<select id="type"><option>Ebook</option><option>Audiobook</option></select></label></div><div class="two"><label>Format<input id="format" value="PDF"></label><label>Price (ETB)<input id="price" type="number" min="0" step="0.01" required></label></div><label><input id="free" type="checkbox"> Free</label><label>Cover image<input id="cover" type="file" accept="image/*"></label><label>Ebook PDF<input id="pdf" type="file" accept="application/pdf"></label><label>Audiobook<input id="audio" type="file" accept="audio/*"></label><label><input id="published" type="checkbox" checked> Published on storefront</label><br><button class="btn primary" type="submit">Save product</button><button class="btn" type="button" id="reset">Clear</button><div id="bookMsg"></div></form><div id="booksAdmin"></div></div><div class="payment"><h2>Orders & payments</h2><div id="ordersAdmin">Loading…</div></div><a class="btn" href="index.html">← Back to store</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.STORE_CONFIG||{},sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);let currentUser=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
async function refresh(){const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;if(!currentUser){$('login').hidden=false;$('dash').hidden=true;return}const {data:me,error:meError}=await sb.from('admin_users').select('user_id').eq('user_id',currentUser.id).maybeSingle();if(meError){$('login').hidden=false;$('dash').hidden=true;$('loginMsg').textContent='Admin check failed: '+meError.message;return}if(!me){$('login').hidden=false;$('dash').hidden=true;$('loginMsg').textContent='Signed in, but this account is not an admin yet. Enter the one-time setup code and tap Claim admin access.';return}$('login').hidden=true;$('dash').hidden=false;loadBooks();loadOrders()}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('loginMsg').textContent='Enter your email.';$('send').disabled=true;$('loginMsg').textContent='Sending secure sign-in link…';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('send').disabled=false;$('loginMsg').textContent=error?error.message:'✅ Check your email for the secure sign-in link, then return here.'};
$('claim').onclick=async()=>{const code=$('setupCode').value.trim();if(!code)return $('loginMsg').textContent='Enter the setup code.';const {data,error}=await sb.rpc('claim_admin',{p_code:code});$('loginMsg').textContent=error?error.message:(data?'✅ Admin access activated. Reloading…':'Invalid or already-used setup code.');if(data)setTimeout(()=>location.reload(),700)};
$('logout').onclick=()=>sb.auth.signOut().then(refresh);
function resetForm(){['bookId','title','description','language','format','price'].forEach(id=>$(id).value='');$('language').value='English';$('format').value='PDF';$('published').checked=true;$('free').checked=false;$('cover').value='';$('pdf').value='';$('audio').value=''}$('reset').onclick=resetForm;
async function upload(bucket,file){if(!file)return null;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${crypto.randomUUID()}-${safe}`;const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false});if(error)throw error;return path}
$('bookForm').onsubmit=async e=>{e.preventDefault();$('bookMsg').textContent='Saving…';try{const coverPath=await upload('book-covers',$('cover').files[0]);const pdfPath=await upload('digital-products',$('pdf').files[0]);const audioPath=await upload('digital-products',$('audio').files[0]);let coverUrl=null;if(coverPath)coverUrl=sb.storage.from('book-covers').getPublicUrl(coverPath).data.publicUrl;const {error}=await sb.rpc('admin_upsert_book',{p_id:$('bookId').value||null,p_title:$('title').value.trim(),p_description:$('description').value.trim(),p_language:$('language').value.trim(),p_type:$('type').value,p_format:$('format').value.trim(),p_price:Number($('price').value||0),p_currency:'ETB',p_is_free:$('free').checked,p_cover_url:coverUrl,p_file_path:pdfPath,p_audio_path:audioPath,p_is_published:$('published').checked});if(error)throw error;$('bookMsg').textContent='Saved successfully.';resetForm();loadBooks()}catch(err){console.error(err);$('bookMsg').textContent='Save failed: '+err.message}};
async function loadBooks(){const {data,error}=await sb.from('books').select('*').order('created_at',{ascending:false});if(error){$('booksAdmin').textContent=error.message;return}$('booksAdmin').innerHTML='<h3>Catalogue</h3>'+data.map(b=>`<div class="pay-card" style="margin:10px 0"><b>${esc(b.title)}</b><span>${Number(b.price).toLocaleString()} ${esc(b.currency)} · ${b.is_published?'Published':'Hidden'}</span><button class="btn" onclick="editBook('${b.id}')">Edit</button><button class="btn" onclick="toggleBook('${b.id}',${!b.is_published})">${b.is_published?'Unpublish':'Publish'}</button><button class="btn" onclick="deleteBook('${b.id}')">Delete</button></div>`).join('')||'<p>No products yet.</p>'}
window.editBook=async id=>{const {data}=await sb.from('books').select('*').eq('id',id).single();if(!data)return;$('bookId').value=data.id;$('title').value=data.title;$('description').value=data.description||'';$('language').value=data.language||'';$('type').value=data.type;$('format').value=data.format||'';$('price').value=data.price;$('published').checked=data.is_published;$('free').checked=data.is_free;scrollTo({top:0,behavior:'smooth'})};
window.toggleBook=async(id,p)=>{const b=(await sb.from('books').select('*').eq('id',id).single()).data;if(!b)return;await sb.rpc('admin_upsert_book',{p_id:b.id,p_title:b.title,p_description:b.description,p_language:b.language,p_type:b.type,p_format:b.format,p_price:b.price,p_currency:b.currency,p_is_free:b.is_free,p_cover_url:b.cover_url,p_file_path:b.file_path,p_audio_path:b.audio_path,p_is_published:p});loadBooks()};
window.deleteBook=async id=>{if(!confirm('Delete this product?'))return;const {error}=await sb.rpc('admin_delete_book',{p_id:id});if(error)alert(error.message);loadBooks()};
async function loadOrders(){const {data,error}=await sb.from('orders').select('id,book_id,customer_name,customer_email,customer_phone,amount,currency,status,payment_reference,payment_proof_path,created_at').order('created_at',{ascending:false});if(error){$('ordersAdmin').textContent=error.message;return}const booksBy={};const b=(await sb.from('books').select('id,title')).data||[];b.forEach(x=>booksBy[x.id]=x.title);$('ordersAdmin').innerHTML=data.map(o=>`<div class="pay-card" style="margin:10px 0"><strong>${esc(booksBy[o.book_id]||'Book')}</strong><span>Customer: ${esc(o.customer_name)} · ${esc(o.customer_phone)}</span><span>${Number(o.amount).toLocaleString()} ${esc(o.currency)} · <b>${esc(o.status)}</b></span><span>Payment ref: ${esc(o.payment_reference||'—')}</span><small>${new Date(o.created_at).toLocaleString()}</small><button class="btn primary" onclick="setOrder('${o.id}','approved')">Approve</button><button class="btn" onclick="setOrder('${o.id}','rejected')">Reject</button></div>`).join('')||'<p>No orders yet.</p>'}
window.setOrder=async(id,status)=>{const {error}=await sb.rpc('admin_update_order',{p_order_id:id,p_status:status});if(error)alert(error.message);loadOrders()};
sb.auth.onAuthStateChange(()=>setTimeout(refresh,250));refresh();
</script></body></html>
